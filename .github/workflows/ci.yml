name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # gawk and mawk are both wanted, and they are alternatives for /usr/bin/awk
      # rather than one package -- the adapters call each binary by name for that
      # reason. ripgrep is the only RE2-family engine in the list.
      - name: install the engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gawk mawk ripgrep

      - run: pip install -e ".[dev]"

      - name: every engine can actually answer, and this step can tell when one cannot
        # The suite skips per-engine tests for anything that cannot answer, which
        # is right on a stranger's laptop and a trap in CI: it would go green
        # having tested four engines and reported agreement between them. This
        # step is what makes the skips safe.
        #
        # It was `--list-engines | grep -q missing`, which had both problems in
        # logbook#64 at once. Negated and unwitnessed: green whether or not the
        # word could ever appear, so renaming the state would have retired the
        # check silently. And aimed one layer above the thing it guards --
        # `grep -P` is a mode of a binary, not a binary, so a grep built without
        # PCRE is on PATH, answers nothing, and passed this check. Verified: with
        # tests/shims/grep-without-pcre first on PATH the old step was green.
        #
        # So: positive assertions on a counted summary line, which go red when
        # they rot rather than quiet, and each state produced on purpose below so
        # that nothing here is asserting against a string that cannot appear.
        run: |
          regexdrift --list-engines

          # The denominator is deliberately literal. Add an engine and this step
          # goes red until it is installed in this job too, which is the point.
          regexdrift --list-engines \
            | grep -qxF '10 of 10 engines can answer here.' || {
                echo "not every engine can answer here, so the suite below skips rather than passes"
                exit 1
              }

          # Witness 1, the missing state. Needs no fixture: an empty PATH does
          # it. python stays ready because its binary is sys.executable, an
          # absolute path -- which is the clearest statement available of what a
          # PATH check can and cannot see.
          env PATH=/var/empty "$(command -v regexdrift)" --list-engines \
            | grep -qxF '1 of 10 engines can answer here. 9 missing, 0 installed but unusable.' || {
                echo "the empty-PATH witness did not report 9 of 10 missing"
                env PATH=/var/empty "$(command -v regexdrift)" --list-engines || true
                exit 1
              }

          # Witness 2, the state a PATH check cannot see at all. The shim is a
          # grep that exits 2 on -P and forwards everything else, which is what
          # busybox grep, BSD grep and a --disable-perl-regexp GNU grep all do.
          # The assignments prefix regexdrift only, so the grep on the right of
          # the pipe is the real one and not the shim.
          SHIM_REAL_GREP="$(command -v grep)" PATH="$PWD/tests/shims/grep-without-pcre:$PATH" \
            regexdrift --list-engines \
            | grep -qxF '9 of 10 engines can answer here. 0 missing, 1 installed but unusable.' || {
                echo "the no-PCRE witness did not report grep -P unusable"
                SHIM_REAL_GREP="$(command -v grep)" PATH="$PWD/tests/shims/grep-without-pcre:$PATH" \
                  regexdrift --list-engines || true
                exit 1
              }

      - run: python -m pytest

  dogfood:
    # Run it on the patterns it was built for. A tool that has only ever been run
    # by its own test suite is a tool nobody has run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gawk mawk ripgrep
      - run: pip install -e .

      - name: every engine can answer here too
        # Same vacuity risk as the test job: every assertion below is about what
        # the engines did, and an absent engine cannot disagree with anything.
        # Witnessed by the two controls in the test job.
        run: regexdrift --list-engines | grep -qxF '10 of 10 engines can answer here.'

      # `code=0; cmd || code=$?` rather than `cmd; code=$?`, because these steps
      # run under `bash -e` and finding drift is an exit 1 on purpose.
      - name: the oh-my-zsh battery pattern is caught
        run: |
          code=0; regexdrift '\d+%' || code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          regexdrift '\d+%' | grep -q 'never added' \
            || { regexdrift '\d+%'; echo "wrong or missing note"; exit 1; }

      - name: a word boundary moved into awk is caught
        # In awk \b is a backspace, so this matches nothing there and says
        # nothing about it. gawk spells the boundary \y; mawk has neither.
        run: |
          code=0; regexdrift '\bversion\b' --engine grep --engine gawk || code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: a portable pattern stays quiet
        # The guard on the whole tool. If this ever exits non-zero, regexdrift
        # has started reporting drift that is not there, which would make every
        # other finding above worthless.
        run: |
          regexdrift 'hello'
          regexdrift '[0-9][0-9]*%'
          regexdrift '^[a-z_][a-z0-9_]*$'

      - name: a missing engine is named, never dropped
        run: |
          regexdrift 'hello' --engine grep --engine 'grep -E' --json \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["drift"] is False, d'

      - name: nothing to compare is exit 2, not exit 0
        run: |
          code=0; regexdrift 'hello' --engine grep || code=$?
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

  actionlint:
    # logbook#23: nothing in the org runs this, and a workflow that does not
    # compile produces no jobs, no logs and no annotations to read afterwards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
