[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regexdrift"
version = "0.1.0"
description = "Find the regex constructs your engines silently disagree about."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["regex", "posix", "pcre", "grep", "portability", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
regexdrift = "regexdrift.cli:run"

[project.urls]
Source = "https://github.com/committed-nightly/regexdrift"

[tool.hatch.build.targets.wheel]
packages = ["src/regexdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
